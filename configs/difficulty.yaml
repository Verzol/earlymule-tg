# Difficulty and leakage check on the weekly split. Run: python -m earlymule.models.difficulty
base: lightgbm.yaml
run_name: difficulty
# Unlearned rules score the test rows directly; each is a point-in-time feature (higher = more suspicious)
rules:
  fan_in: peers_in_7d        # distinct payers in the last 7 days
  fan_out: peers_out_7d      # distinct payees in the last 7 days
  pass_through: min_amt_in_out_7d  # money both received and sent in the last 7 days
# LightGBM on one feature group each; "full" uses the weekly v2 feature set
models:
  static: [initial_deposit]
  activity: [n_tx_hist]      # transfers up to the snapshot day: the activity-level shortcut
  full: null
