# Walking skeleton: weekly snapshots, point-in-time features, LightGBM. Run: python -m earlymule.models.tabular
run_name: lightgbm_weekly_v2
seed: 0
total_days: 720
split_fractions: [0.60, 0.15, 0.25]
horizon_days: 7          # snapshot every 7 days; positives are mules whose onset falls in the last 7 days
min_history_days: 30     # first snapshot once the 30-day window is full
windows: [1, 7, 30]
train_negative_rate: 0.05  # share of negative train rows kept; all positives kept
regular_min_tx: 20       # "regular" population: at least this many transfers up to the snapshot day
recall_k: 100            # accounts reviewed per weekly snapshot
lightgbm:
  objective: binary
  learning_rate: 0.01
  # Upper bound only; early stopping on validation PR-AUC picks the round. With the 72 features the daily run
  # still improved at round 3000 (seed 0, 2026-11-13, best_iteration = 3000), so the cap was raised from 3000
  n_estimators: 10000
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  n_jobs: 4
  deterministic: true
  force_row_wise: true
  verbose: -1
# Weekly seed 1 validation PR-AUC: 0.742 at round 3, 0.53 at 50, 0.63 at 300, then 0.797 at 1416;
# with patience 300 it stopped at round 3 (2026-11-10)
early_stopping_rounds: 1000
# Cumulative counts grow with the calendar, so later values sit outside the train range; n_tx_hist only
# chooses the regular population. Validation, daily seed 0 (2026-11-10): adding both moved PR-AUC
# 0.548 -> 0.552, within the seed-to-seed sd of 0.004, so they stay out.
exclude_features: [n_tx_hist, days_since_first_tx]
bootstrap_samples: 1000   # case-bootstrap resamples for 95% intervals on test
