# Walking skeleton: weekly snapshots, point-in-time features, LightGBM. Run: python -m earlymule.models.tabular
run_name: lightgbm_weekly_v2
seed: 0
total_days: 720
split_fractions: [0.60, 0.15, 0.25]
horizon_days: 7          # snapshot every 7 days; positives are mules whose onset falls in the last 7 days
min_history_days: 30     # first snapshot once the 30-day window is full
windows: [1, 7, 30]
train_negative_rate: 0.05  # share of negative train rows kept; all positives kept
regular_min_tx: 20       # "regular" population: at least this many transfers up to the snapshot day
recall_k: 100            # accounts reviewed per weekly snapshot
lightgbm:
  objective: binary
  learning_rate: 0.01
  n_estimators: 3000
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  n_jobs: 4
  deterministic: true
  force_row_wise: true
  verbose: -1
early_stopping_rounds: 300  # at learning rate 0.05 validation PR-AUC dipped for ~400 rounds before recovering; 0.01 rises steadily
# Cumulative counts grow with the calendar, so test values sit outside the train range; kept only for
# choosing the regular population (n_tx_hist). On 2026-11-04 window features alone gave test PR-AUC
# 0.61 against 0.51 with these included.
exclude_features: [n_tx_hist, days_since_first_tx]
