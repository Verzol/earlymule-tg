# GPU conda env for debugging the temporal graph models on the laptop (RTX 4050, driver CUDA 12.7). Create in WSL:
#   conda env create -f environment-gpu.yml
# Same torch and PyG versions as the Kaggle run (docs/setup.md section 4.3); the CUDA 12.6 build fits the driver,
# Kaggle's 13.0 build does not. Full runs stay on Kaggle; the CPU env `earlymule` is unchanged.
name: earlymule-gpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy>=1.26
  - pandas>=2.2
  - pyarrow>=15
  - scikit-learn>=1.4
  - lightgbm>=4.3
  - pyyaml>=6
  - pytest>=8
  - ipykernel
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.11.0+cu126
      - torch_geometric==2.8.1
      - -e .
